plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rstone.rstone_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.rstone.rstone_flutter"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // 启用代码混淆与资源压缩，降低 release 包体积。
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "edition"
    productFlavors {
        full {
            dimension "edition"
        }
        lite {
            dimension "edition"
        }
    }
}

flutter {
    source = "../.."
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantTaskName =
            variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def buildTypeTaskName =
            variant.buildType.name.substring(0, 1).toUpperCase() + variant.buildType.name.substring(1)
        def compileFlutterTask =
            tasks.findByName("compileFlutterBuild${variantTaskName}")

        if (compileFlutterTask != null) {
            compileFlutterTask.doNotTrackState(
                "Flutter build task may expose unreadable outputs on mapped network drives."
            )

            tasks.matching { it.name == "merge${variantTaskName}Shaders" }.configureEach {
                dependsOn(compileFlutterTask)
            }

            tasks.matching { it.name == "check${variantTaskName}AarMetadata" }.configureEach {
                dependsOn(compileFlutterTask)
            }

            rootProject.subprojects.each { subproject ->
                subproject.tasks.matching {
                    it.name == "merge${buildTypeTaskName}Shaders"
                }.configureEach {
                    dependsOn(compileFlutterTask)
                }
            }

            if (variant.flavorName == "lite") {
                def liteFontNames = [
                    "MicrosoftYaHei.ttf",
                    "MicrosoftYaHeiBold.ttf",
                    "SimHei.ttf",
                ]

                tasks.matching { it.name == "merge${variantTaskName}Assets" }.configureEach {
                    dependsOn(compileFlutterTask)
                    doLast {
                        liteFontNames.each { fontName ->
                            delete(
                                "${buildDir}/intermediates/flutter/${variant.name}/flutter_assets/assets/fonts/${fontName}"
                            )
                            delete(
                                "${buildDir}/intermediates/assets/${variant.name}/merge${variantTaskName}Assets/flutter_assets/assets/fonts/${fontName}"
                            )
                        }
                    }
                }

                tasks.matching { it.name == "compress${variantTaskName}Assets" }.configureEach {
                    doLast {
                        liteFontNames.each { fontName ->
                            delete(
                                "${buildDir}/intermediates/compressed_assets/${variant.name}/compress${variantTaskName}Assets/out/assets/flutter_assets/assets/fonts/${fontName}"
                            )
                        }
                    }
                }
            }
        }
    }
}
