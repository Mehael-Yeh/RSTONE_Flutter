name: rst_flutter
description: "锐石 RSTONE - Flutter多平台应用"
publish_to: 'none'

version: 2.0.1+29876121

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.6.18
  yaml: ^3.1.2
  path_provider: ^2.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.2.2
  reorderables: ^0.6.0
  share_plus: ^10.0.0
  archive: ^3.6.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  cryptography: 2.9.0
  unorm_dart: 0.3.3
  http: ^1.2.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4
  sqlite3_flutter_libs: 0.5.41
  idb_shim: 2.6.7

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data_sync_config.json
    - assets/tag_alias_rules.default.txt
    - assets/fonts/MicrosoftYaHei.ttf
    - assets/fonts/MicrosoftYaHeiBold.ttf
    - assets/fonts/SimHei.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon: false
