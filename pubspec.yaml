name: rst_flutter
description: "锐石 RSTONE - Flutter多平台应用"
publish_to: 'none'

version: 0.0.11+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.6.18
  yaml: ^3.1.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/产品列表/
    - assets/产品应用/
    - assets/产品列表.json
    - assets/产品应用.json
