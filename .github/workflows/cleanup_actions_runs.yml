name: Retain evidence and clean redundant Actions artifacts

on:
  schedule:
    # UTC 20:00 = next day 04:00 CST (UTC+8); replaces the old run-deletion job.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only plan (disable only after reviewing a dry-run)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  # Keep the existing group while replacing the old workflow, never cancel mid-delete.
  group: cleanup-actions-runs
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Mehael-Yeh/RSTONE_Flutter' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test retention safety with synthetic fixtures
        run: python3 -B -m unittest discover -s scripts -p 'test_cleanup_actions_artifacts.py' -v
      - name: Plan or clean redundant artifacts (never runs or caches)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # JSON comparison rejects missing/empty input instead of GitHub's loose == false coercion.
          CLEANUP_APPLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && toJSON(inputs.dry_run) == 'false') }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$CLEANUP_APPLY" == 'true' ]]; then
            args+=(--apply)
          fi
          python3 -B scripts/cleanup_actions_artifacts.py "${args[@]}"
