name: 已发布App独立验收

'on':
  workflow_dispatch:
    inputs:
      pages_run:
        description: Exact successful Pages run at approved source SHA
        required: true
        default: '41896830701'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-published:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 取得独立验收工具
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: 取得精确批准的App源码
        uses: actions/checkout@v4
        with:
          ref: 8d2fdeb60f9e5a1b5164756f9ce29e81672f1832
          path: source
          persist-credentials: false
      - name: 对比Web发布产物与线上匿名字节
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RUN: ${{ inputs.pages_run }}
        run: >-
          python3 harness/scripts/validate_web_delivery.py
          --run "$PAGES_RUN"
          --expected-version 2.0.5
          --head 8d2fdeb60f9e5a1b5164756f9ce29e81672f1832
          --output acceptance
      - name: 配置官方Java工具
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置固定Android验签工具
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: 验证真实公开APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 harness/scripts/validate_published_apks.py
          --source source
          --head 8d2fdeb60f9e5a1b5164756f9ce29e81672f1832
          --baseline v2.0.1
          --expected-version 2.0.6
          --source-version 2.0.5
          --output acceptance
      - name: 保留独立验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-independent-acceptance
          path: |
            acceptance/WEB_ACCEPTANCE.json
            acceptance/APK_ACCEPTANCE.json
            acceptance/baseline-identities.json
            acceptance/SHA256SUMS.published.txt
          if-no-files-found: warn
          retention-days: 30
