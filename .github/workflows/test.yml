name: 已发布App独立验收

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-published:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 取得独立验收工具
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: 取得精确批准的App源码
        uses: actions/checkout@v4
        with:
          ref: a2b302b459d9f3e181de9c2712662678300a28c6
          path: source
          persist-credentials: false
      - name: 对比Web发布产物与线上匿名字节
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 harness/scripts/validate_web_delivery.py
          --run 41790035637
          --head a2b302b459d9f3e181de9c2712662678300a28c6
          --output acceptance
      - name: 配置官方Java工具
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置固定Android验签工具
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: 验证真实公开APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 harness/scripts/validate_published_apks.py
          --source source
          --head a2b302b459d9f3e181de9c2712662678300a28c6
          --baseline v2.0.1
          --output acceptance
      - name: 保留独立验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-independent-acceptance
          path: |
            acceptance/WEB_ACCEPTANCE.json
            acceptance/APK_ACCEPTANCE.json
            acceptance/baseline-identities.json
            acceptance/SHA256SUMS.published.txt
          if-no-files-found: warn
          retention-days: 30
