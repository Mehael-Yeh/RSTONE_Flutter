name: Validate application shell
on:
  push:
    paths: ['lib/**', 'test/**', 'integration_test/**', 'scripts/**', 'pubspec.*', 'assets/data_sync_config.json', 'assets/tag_alias_rules.default.txt', '.github/workflows/*.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/validate_data_sync_config.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter test --platform chrome test/browser_storage_test.dart
      - run: |
          RSTONE_APP_VERSION=$(python3 -c 'import re; print(re.search(r"^version:\s*([^+\s]+)", open("pubspec.yaml").read(), re.M).group(1))')
          flutter build web --release --no-web-resources-cdn --dart-define=APP_VERSION="$RSTONE_APP_VERSION"
          python3 scripts/prepare_web_offline.py
  android-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - edition: full
            lite: 'false'
          - edition: lite
            lite: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: flutter test integration_test/native_sync_test.dart --flavor ${{ matrix.edition }} --dart-define=RSTONE_LITE=${{ matrix.lite }} -d emulator-5554
