name: QA only - product scroll AOT profile proxy
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact 40 lowercase hex App source (maintenance baseline has same list sources as 2.0.4)
        required: true
        type: string
        default: '8c77edb71cd32a287302d5d24d6faed07a3a855d'
      candidate_sha:
        description: Exact reviewed candidate 40 lowercase hex App source (no moving ref)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  profile-proxy:
    if: startsWith(github.ref, 'refs/heads/qa/profile-scroll-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reject anything except distinct exact source SHAs
        run: |
          python3 - <<'PY'
          import os,re
          a=os.environ['BASELINE_SHA']; b=os.environ['CANDIDATE_SHA']
          assert re.fullmatch('[0-9a-f]{40}',a) and re.fullmatch('[0-9a-f]{40}',b) and a != b
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Stdlib evidence and synthetic protocol self-tests (not performance results)
        working-directory: qa-tooling/qa_scroll_profile
        run: python3 -B -m unittest test_verify -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Enable Android emulator hardware acceleration (existing test workflow)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-boot-timeout: 300
          script: python3 qa-tooling/qa_scroll_profile/run_compare.py --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" --workspace "$GITHUB_WORKSPACE"
      - name: Keep only QA measurement evidence (no APK or business assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-product-scroll-profile-proxy
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
