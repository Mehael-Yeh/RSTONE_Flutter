name: Release Alpha APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.*'
      - 'assets/fonts/**'
      - 'assets/data_sync_config.json'
      - 'assets/tag_alias_rules.default.txt'
      - 'scripts/next_app_version.py'
      - 'scripts/validate_data_sync_config.py'
      - 'scripts/verify_release_apks.py'
      - '.github/workflows/release_alpha.yml'
      - '.github/workflows/release_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release_apk.yml
    with:
      channel: alpha
    secrets: inherit
