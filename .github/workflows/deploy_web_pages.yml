name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.*'
      - 'assets/fonts/**'
      - 'assets/icon.png'
      - 'assets/data_sync_config.json'
      - 'assets/tag_alias_rules.default.txt'
      - '.github/workflows/deploy_web_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production data source configuration
        run: python3 scripts/validate_data_sync_config.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure web platform files exist
        run: |
          if [ ! -f web/index.html ]; then
            PROJECT_NAME=$(awk -F': ' '/^name:/{print $2; exit}' pubspec.yaml)
            flutter create --platforms=web --project-name "$PROJECT_NAME" .
          fi

      - name: Generate web icons
        run: python3 scripts/generate_web_icons.py

      - name: Build web app
        run: |
          RSTONE_APP_VERSION=$(python3 -c 'import re; print(re.search(r"^version:\s*([^+\s]+)", open("pubspec.yaml").read(), re.M).group(1))')
          flutter build web --release --no-web-resources-cdn \
            --dart-define=APP_VERSION="$RSTONE_APP_VERSION" \
            --base-href "/${{ github.event.repository.name }}/"
          python3 scripts/prepare_web_offline.py
          touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
